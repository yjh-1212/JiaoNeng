<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>⟦待填写⟧ · 设计原型</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#212733;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}.top{background:white;border-bottom:2px solid #ba2c2c;padding:18px 28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.muted{color:#667084;font-size:13px}.container{max-width:1120px;margin:28px auto;padding:0 18px}section{background:white;padding:24px;border:1px solid #e2e5eb;border-radius:12px;box-shadow:0 4px 18px #15213a0b}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button,input{font:inherit;padding:10px 12px;border-radius:7px;border:1px solid #d9dce3}button{cursor:pointer;background:white}button.primary{background:#b92327;color:white;border-color:#b92327}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px;border-bottom:1px solid #eceef1}th{color:#5d687b;background:#f8f9fb}.notice{padding:12px 16px;border:1px dashed #cd9a45;background:#fff8ec;border-radius:9px;margin-bottom:20px}.modal{position:fixed;inset:0;background:#08101d80;display:none;place-items:center}.panel{width:min(500px,94vw);background:white;border-radius:12px;padding:26px}.modal.open{display:grid}
</style>
</head>
<body>
<header class="top"><strong>⟦待填写⟧ · 产品设计原型</strong><span class="muted">设计阶段 / 非正式系统</span></header>
<div class="container">
<div class="notice">此页面仅为模板示意，以下交互和数据不代表任何项目的已确认业务要求。请按 D4 页面规格重做并删除全部 ⟦待填写⟧。</div>
<section id="page-001"><div class="muted">PAGE-001（模板示意）</div><h2>⟦待填写⟧</h2><p>请选择业务页面，替换此模板并完成所有核心页面的可交互原型。</p><div class="toolbar"><input id="q" placeholder="输入关键字筛选示例行"><button onclick="filterRows()">查询</button><button onclick="resetRows()">重置</button><button class="primary" onclick="openModal()">新增（交互示意）</button></div><table><thead><tr><th>编号</th><th>名称</th><th>操作</th></tr></thead><tbody id="rows"><tr><td>DEMO-01</td><td>示意记录甲（模拟）</td><td><button onclick="openModal()">查看</button></td></tr><tr><td>DEMO-02</td><td>示意记录乙（模拟）</td><td><button onclick="openModal()">查看</button></td></tr></tbody></table></section>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="panel"><h3>操作示例（非真实业务）</h3><p class="muted">此弹窗后续应按真实 PRD 的字段、规则、状态重新设计。</p><div class="toolbar"><button onclick="closeModal()">取消</button><button class="primary" onclick="alert('示意：未保存到真实数据库');closeModal()">确认</button></div></div></div>
<script>
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function filterRows(){const q=document.getElementById('q').value.trim();document.querySelectorAll('#rows tr').forEach(tr=>tr.hidden=!tr.textContent.includes(q))}
function resetRows(){document.getElementById('q').value='';filterRows()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})
</script>
</body></html>
